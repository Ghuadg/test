     <svg style="font-size: 200px; height: 200px;"
      fill="none"
      stroke="currentColor"

      strokeWidth={2}
      viewBox="0 0 24 24"

    >
      <path stroke="none" d="M0 0h24v24H0z" />
      <path d="M9 17 A2 2 0 0 1 7 19 A2 2 0 0 1 5 17 A2 2 0 0 1 9 17 z" />
      <path d="M19 17 A2 2 0 0 1 17 19 A2 2 0 0 1 15 17 A2 2 0 0 1 19 17 z" />

    </svg>
    <h3>В ближайшее время с вами свяжется наш менеджер и товар будет отправлен на указанный адрес</h3>
    <h3>Вы будете перенаправлены на главную страницу <span style="color: 0000ff">через:</span></h3>
      <div id="countdown">5</div>

    <style>
        #countdown {
        color: blue;
        margin-bottom: 10px;
        font-size: 20px;
        font-family: "Didact Gothic";
        font-weight: bold;
    }
    </style>

    <script>

            let timeLeft = 5;
            const countdownFunction = setInterval(function() {
                timeLeft--;
                document.getElementById("countdown").innerHTML = timeLeft;


                if (timeLeft <= 0) {
                    clearInterval(countdownFunction);
                    document.getElementById("countdown").innerHTML = "Перенаправление";
                }
            }, 1000);
    </script>

</div>
